name: Refresh DropWatch

on:
  schedule:
    # Runs every 3 hours. GitHub Actions cron uses UTC and can be delayed
    # by a few minutes under load — fine for this use case.
    - cron: "0 */3 * * *"
  workflow_dispatch: {} # lets you trigger it manually from the Actions tab too

jobs:
  refresh:
    runs-on: ubuntu-latest
    env:
      REFRESH_SECRET: ${{ secrets.REFRESH_SECRET != '' && secrets.REFRESH_SECRET || vars.REFRESH_SECRET }}
    steps:
      - name: Call DropWatch refresh endpoint
        run: |
          if [ -z "$REFRESH_SECRET" ]; then
            echo "REFRESH_SECRET is not configured in repository secrets/variables; skipping refresh call."
            exit 0
          fi

          response=$(curl -s -o response.json -w "%{http_code}" -X POST \
            "https://dropwatch-24qf.onrender.com/api/refresh" \
            -H "x-refresh-secret: $REFRESH_SECRET")

          echo "HTTP status: $response"
          cat response.json

          if [ "$response" -ge 400 ]; then
            echo "Refresh failed"
            exit 1
          fi
