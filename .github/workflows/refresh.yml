name: Refresh DropWatch
on:
  schedule:
    - cron: "0 */1 * * *"
  workflow_dispatch:

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Refresh API
        run: |
          curl --fail-with-body -X POST \
            -H "x-refresh-secret: ${{ secrets.REFRESH_SECRET }}" \
            https://dropwatch-24qf.onrender.com/api/refresh
